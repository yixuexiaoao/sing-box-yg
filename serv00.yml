name: Keep Servers Alive
on:
  # schedule:
  #   - cron: "0 */4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keep_servers_alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y sshpass curl jq
      - name: Deploy or check servers
        env:
          ACCOUNTS: ${{ secrets.SERV00_ACCOUNTS }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          [[ -n $SSH_KNOWN_HOSTS ]] || { echo '缺少经过独立核验的 SSH_KNOWN_HOSTS'; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          bash kp.sh
