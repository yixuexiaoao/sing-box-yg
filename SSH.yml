name: Keep Servers serv00
on:
  schedule:
   - cron: '0 15 */8 * *'
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  keep_servers_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass jq

      - name: Process each account
        env:
          ACCOUNTS: ${{ secrets.SSH_ACCOUNTS }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
           if [[ -z $SSH_KNOWN_HOSTS ]]; then
             echo '缺少经过独立核验的 SSH_KNOWN_HOSTS'
             exit 1
           fi
           umask 077
           known_hosts=$(mktemp)
           trap 'rm -f "$known_hosts"' EXIT
           printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts"
           accounts=$(jq -ce 'if type == "array" and length > 0 then .[] else error("invalid SSH_ACCOUNTS") end' <<< "$ACCOUNTS") || exit 1
           echo "*****************************************************"
           echo "*****************************************************"
           echo "甬哥Github项目  ：github.com/yonggekkk"
           echo "甬哥Blogger博客 ：ygkkk.blogspot.com"
           echo "甬哥YouTube频道 ：www.youtube.com/@ygkkk"
           echo "vps服务器远程登录一次SSH脚本【Github】"
           echo "*****************************************************"
           echo "*****************************************************"
            count=0  
           while IFS= read -r account; do
              count=$((count+1))
              SSH_USER=$(jq -er '.SSH_USER | select(type == "string" and length > 0)' <<< "$account") || exit 1
              SSH_PASS=$(jq -er '.SSH_PASS | select(type == "string" and length > 0)' <<< "$account") || exit 1
              HOST=$(jq -er '.HOST | select(type == "string" and length > 0)' <<< "$account") || exit 1
           if SSHPASS=$SSH_PASS sshpass -e ssh -o StrictHostKeyChecking=yes -o VerifyHostKeyDNS=no -o ForwardAgent=no -o ConnectTimeout=15 \
             -o "UserKnownHostsFile=$known_hosts" -o GlobalKnownHostsFile=/dev/null -l "$SSH_USER" -- "$HOST" exit; then
            echo "🎉恭喜！✅第【$count】台服务器连接成功！🚀服务器地址：$HOST ，账户名：$SSH_USER" 
           else
            echo "===================================================="
            echo "💥杯具！❌第【$count】台服务器连接失败！🚀服务器地址：$HOST ，账户名：$SSH_USER"
            echo "⚠️可能账号名、密码、服务器名称输入错误，或者当前服务器在维护中"  
            echo "===================================================="
           fi
           sleep 10
            done <<< "$accounts"
