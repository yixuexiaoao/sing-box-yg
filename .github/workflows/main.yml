name: Authenticated Serv00 keepalive
on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Call management endpoints
        env:
          HTTP_TARGETS: ${{ secrets.HTTP_TARGETS }}
        run: |
          set -euo pipefail
          targets=$(jq -ce 'if type == "array" and length > 0 then .[] else error("invalid HTTP_TARGETS") end' <<< "$HTTP_TARGETS")
          count=0
          while IFS= read -r target; do
            count=$((count+1))
            url=$(jq -er '.url | select(type == "string")' <<< "$target")
            token=$(jq -er '.token | select(type == "string" and test("^[a-f0-9]{64}$"))' <<< "$target")
            [[ $url =~ ^https://[A-Za-z0-9.-]+/(up|re)$ ]] || { echo "第 $count 项 URL 格式错误"; exit 1; }
            if printf 'header = "Authorization: Bearer %s"\n' "$token" | curl -fsS --connect-timeout 10 --max-time 190 --config - -X POST "$url" >/dev/null 2>&1; then
              echo "第 $count 项操作完成"
            else
              echo "第 $count 项操作失败"
              exit 1
            fi
          done <<< "$targets"
